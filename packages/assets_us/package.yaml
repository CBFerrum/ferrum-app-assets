package: assets_us
version: 0.1.0
label: "Depreciation tables: United States"
description: "The half-year depreciation tables of the United States' general depreciation system, as Depreciation Table records a tax book can use."
depends: [assets]

# Source of every percent below: IRS Publication 946 (2025), "How To Depreciate Property", Appendix A,
# Table A-1 "3-, 5-, 7-, 10-, 15-, and 20-Year Property, Half-Year Convention" (page 70), read on 2026-11-18
# from https://www.irs.gov/pub/irs-pdf/p946.pdf. Each table has one row more than its recovery period: the
# half-year convention is in the table itself.
seed:
  - entity: DepreciationTable
    key: [table_name]
    records:
      # Pub. 946 (2025), Table A-1, 3-year column, read 2026-11-18.
      - table_name: "US GDS 3-year, half-year"
        description: "IRS Publication 946 (2025), Appendix A, Table A-1, 3-year property"
        rows: [{year: 1, percent: "33.33"}, {year: 2, percent: "44.45"}, {year: 3, percent: "14.81"}, {year: 4, percent: "7.41"}]
      # Pub. 946 (2025), Table A-1, 5-year column, read 2026-11-18.
      - table_name: "US GDS 5-year, half-year"
        description: "IRS Publication 946 (2025), Appendix A, Table A-1, 5-year property"
        rows: [{year: 1, percent: "20.00"}, {year: 2, percent: "32.00"}, {year: 3, percent: "19.20"}, {year: 4, percent: "11.52"}, {year: 5, percent: "11.52"},
               {year: 6, percent: "5.76"}]
