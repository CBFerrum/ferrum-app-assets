package: assets_ops
version: 0.1.0
label: Equipment Maintenance
description: Lockout, meter and condition triggers, failure codes, calibration and return to service
depends: [assets, ops]
field_prefix: fao_

modules:
  - name: equipment_maintenance
    label: Equipment Maintenance
    icon: wrench
    order: 62
    items: [MaintenanceRequest, EquipmentLockout, AssetMeter, ConditionRule, CalibrationRecord, FailureCode]

roles:
  - name: Maintenance Technician
    description: Works on equipment, locks it out and records what was done. Cannot put it back into service.
    permissions:
      - {entity: Asset, read: true}
      - {entity: Device, read: true}
      - {entity: MaintenanceRequest, read: true, write: true, create: true}
      - {entity: EquipmentLockout, read: true}
      - {entity: AssetMeter, read: true}
      - {entity: ConditionRule, read: true}
      - {entity: CalibrationRecord, read: true, write: true, create: true}
      - {entity: FailureCode, read: true}
  - name: Return to Service Authority
    description: Hands equipment back to operations after maintenance. Separate on purpose - repaired does not mean safe to restart.
    permissions:
      - {entity: Asset, read: true}
      - {entity: AssetMeter, read: true}
      - {entity: ConditionRule, read: true}
      - {entity: Device, read: true}
      - {entity: FailureCode, read: true}
      - {entity: MaintenanceRequest, read: true}
      - {entity: EquipmentLockout, read: true}
  - name: Maintenance Planner
    description: Sets up meters, conditions and failure codes.
    permissions:
      - {entity: Asset, read: true}
      - {entity: Device, read: true}
      - {entity: MaintenanceRequest, read: true, write: true, create: true, export: true}
      - {entity: EquipmentLockout, read: true, export: true}
      - {entity: AssetMeter, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: ConditionRule, read: true, write: true, create: true, delete: true, export: true}
      - {entity: CalibrationRecord, read: true, write: true, create: true, export: true}
      - {entity: FailureCode, read: true, write: true, create: true, delete: true, import: true}
